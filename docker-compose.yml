version: '3.8'

services:
  cms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cms-backend:latest
    container_name: cms-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - SERVER_PORT=8080
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cms_metadata
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
      - PROMETHEUS_METRICS_ENABLED=true
    depends_on:
      - postgres
      - redis
    networks:
      - cms-network

  postgres:
    image: postgres:15-alpine
    container_name: cms-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cms_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cms-network

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cms-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cms-jaeger
    restart: always
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "6831:6831/udp"
    networks:
      - cms-network

  prometheus:
    image: prom/prometheus:latest
    container_name: cms-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
